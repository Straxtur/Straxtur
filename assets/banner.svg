<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Jorge Sánchez López — research, build with agents, some of it ships">
  <!-- Banner del README de GitHub (borrador 2026-10-31), en ámbar y negro a juego con el avatar.
       Animación en SMIL y CSS: funciona como <img>. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0906"/>
      <stop offset="1" stop-color="#1a120b"/>
    </linearGradient>
    <radialGradient id="lampara" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#e08a2c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e08a2c" stop-opacity="0"/>
    </radialGradient>
    <filter id="humo" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="7">
        <animate attributeName="seed" values="7;8;9;10;7" dur="12s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix values="0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0 0.62  0 0 0 0.09 0"/>
    </filter>
    <clipPath id="c1"><rect x="72" y="176" height="40" width="0">
      <animate attributeName="width" values="0;300;300;0;0" keyTimes="0;0.13;0.27;0.33;1" dur="9s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="72" y="176" height="40" width="0">
      <animate attributeName="width" values="0;380;380;0;0" keyTimes="0;0.13;0.27;0.33;1" dur="9s" begin="3s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="72" y="176" height="40" width="0">
      <animate attributeName="width" values="0;490;490;0;0" keyTimes="0;0.13;0.27;0.33;1" dur="9s" begin="6s" repeatCount="indefinite"/></rect></clipPath>
    <path id="r1" d="M 770 170 L 890 100"/>
    <path id="r2" d="M 890 100 L 1010 170"/>
    <path id="r3" d="M 890 100 L 1110 90"/>
  </defs>
  <style>
    .nombre { font: 700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f3e6d0; }
    .terminal { font: 500 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e3a857; }
    .prompt { font: 500 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7a6a55; }
    .etiqueta { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e9d8bd; }
    .etiqueta-oculta { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7a6a55; }
    .nodo { fill: #140e09; stroke: #d08a35; stroke-width: 2; }
    .nodo-oculto { fill: #0f0b07; stroke: #5a4632; stroke-width: 2; stroke-dasharray: 5 5; }
    .linea { stroke: #4a3826; stroke-width: 2; fill: none; }
    .linea-oculta { stroke: #3a2c1e; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
    .pulso { fill: #ffcf7a; }
    .cursor { fill: #e3a857; animation: parpadeo 1s steps(1) infinite; }
    .respira { animation: respira 3s ease-in-out infinite; }
    @keyframes parpadeo { 50% { opacity: 0; } }
    @keyframes respira { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .respira { animation: none; } }
  </style>

  <rect width="1200" height="320" rx="18" fill="url(#fondo)"/>
  <rect width="1200" height="320" rx="18" fill="url(#lampara)"/>
  <rect width="1200" height="320" rx="18" filter="url(#humo)"/>

  <text x="72" y="140" class="nombre">Jorge Sánchez López</text>

  <text x="40" y="206" class="prompt">&gt;</text>
  <g clip-path="url(#c1)"><text x="72" y="206" class="terminal">digging into things</text></g>
  <g clip-path="url(#c2)"><text x="72" y="206" class="terminal">building with AI agents</text></g>
  <g clip-path="url(#c3)"><text x="72" y="206" class="terminal">some of it ships. some doesn't.</text></g>
  <rect class="cursor" x="72" y="184" width="13" height="28">
    <animate attributeName="x" values="72;372;372;72;452;452;72;562;562;72" keyTimes="0;0.043;0.09;0.11;0.153;0.2;0.22;0.263;0.31;0.333" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- research → agents → ship, y una rama a lo que no se enseña -->
  <use href="#r1" class="linea"/>
  <use href="#r2" class="linea"/>
  <use href="#r3" class="linea-oculta"/>

  <circle r="5" class="pulso"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion></circle>
  <circle r="5" class="pulso"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite"><mpath href="#r2"/></animateMotion></circle>
  <circle r="4" class="pulso" fill-opacity="0.35"><animateMotion dur="3.2s" begin="-0.6s" repeatCount="indefinite"><mpath href="#r3"/></animateMotion></circle>

  <circle cx="770" cy="170" r="38" class="nodo respira"/><text x="770" y="175" text-anchor="middle" class="etiqueta">research</text>
  <circle cx="890" cy="100" r="38" class="nodo respira" style="animation-delay:.6s"/><text x="890" y="105" text-anchor="middle" class="etiqueta">agents</text>
  <circle cx="1010" cy="170" r="38" class="nodo respira" style="animation-delay:1.2s"/><text x="1010" y="175" text-anchor="middle" class="etiqueta">ship</text>
  <circle cx="1110" cy="90" r="34" class="nodo-oculto"/><text x="1110" y="95" text-anchor="middle" class="etiqueta-oculta">private</text>
</svg>
